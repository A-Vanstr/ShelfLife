<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ShelfLife</title>
        <meta
            name="description"
            content="ShelfLife helps you scan groceries, track expiry dates, and waste less food."
        />
        <link
            rel="icon"
            type="image/png"
            href="/favicon-96x96.png"
            sizes="96x96"
        />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/apple-touch-icon.png"
        />
        <link rel="manifest" href="/site.webmanifest" />
        <style>
            :root {
                color-scheme: dark;
                --bg: #060708;
                --bg-soft: #0d1013;
                --panel: rgba(255, 255, 255, 0.045);
                --panel-border: rgba(255, 255, 255, 0.1);
                --text: #f4f5f6;
                --muted: rgba(244, 245, 246, 0.72);
                --muted-strong: rgba(244, 245, 246, 0.84);
                --button-bg: #f3f4f6;
                --button-text: #111214;
                --link: rgba(244, 245, 246, 0.7);
                --link-hover: #ffffff;
                --shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                min-height: 100%;
            }

            body {
                font-family:
                    Inter, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial,
                    sans-serif;
                background:
                    radial-gradient(
                        circle at top,
                        rgba(255, 255, 255, 0.1),
                        transparent 34%
                    ),
                    radial-gradient(
                        circle at 20% 80%,
                        rgba(111, 170, 255, 0.08),
                        transparent 28%
                    ),
                    linear-gradient(
                        180deg,
                        #08090a 0%,
                        var(--bg) 40%,
                        #040505 100%
                    );
                color: var(--text);
                overflow-x: hidden;
            }

            body::before,
            body::after {
                content: "";
                position: fixed;
                inset: auto;
                border-radius: 999px;
                pointer-events: none;
                filter: blur(70px);
                opacity: 0.35;
            }

            body::before {
                width: 18rem;
                height: 18rem;
                top: 8%;
                left: -5rem;
                background: rgba(255, 255, 255, 0.12);
            }

            body::after {
                width: 22rem;
                height: 22rem;
                right: -7rem;
                bottom: -5rem;
                background: rgba(139, 184, 255, 0.12);
            }

            main {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                gap: 1.3rem;
                padding: 1.4rem 1.5rem 0;
            }

            .hero {
                width: min(100%, 46rem);
                text-align: center;
                padding: 1.65rem 1.4rem 1.35rem;
                border: 1px solid var(--panel-border);
                border-radius: 1.55rem;
                background: linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.03),
                    rgba(255, 255, 255, 0.02)
                );
                box-shadow: var(--shadow);
                backdrop-filter: blur(16px);
            }

            .brand {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.95rem;
                margin-bottom: 1.25rem;
                padding: 0.6rem 0.9rem 0.6rem 0.6rem;
                border-radius: 999px;
                background: var(--panel);
                border: 1px solid rgba(255, 255, 255, 0.08);
            }

            .brand-mark {
                width: 3rem;
                height: 3rem;
                border-radius: 0.85rem;
                object-fit: cover;
                box-shadow:
                    0 0 0 1px rgba(255, 255, 255, 0.08),
                    0 18px 38px rgba(0, 0, 0, 0.35);
            }

            .brand-copy {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                line-height: 1;
                text-align: left;
            }

            .brand-kicker {
                font-size: 0.75rem;
                letter-spacing: 0.24em;
                text-transform: uppercase;
                color: rgba(244, 245, 246, 0.48);
                margin-bottom: 0.45rem;
            }

            .brand-name {
                font-size: 1.35rem;
                font-weight: 700;
                letter-spacing: 0.01em;
            }

            h1 {
                margin: 0;
                font-family:
                    "SF Pro Display", Inter, "Segoe UI", Roboto, Helvetica,
                    Arial, sans-serif;
                font-size: clamp(2.45rem, 5.8vw, 4.65rem);
                line-height: 1.02;
                letter-spacing: 0;
                text-wrap: balance;
            }

            .subtitle {
                width: min(100%, 35rem);
                margin: 1.1rem auto 1.6rem;
                font-size: clamp(1rem, 2vw, 1.35rem);
                line-height: 1.4;
                color: var(--muted);
                text-wrap: balance;
            }

            .cta-shell {
                display: inline-flex;
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }

            .cta {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.9rem;
                min-width: min(100%, 22rem);
                padding: 0.9rem 1.75rem;
                border: none;
                border-radius: 999px;
                background: linear-gradient(180deg, #ffffff, var(--button-bg));
                color: var(--button-text);
                font-size: clamp(1.05rem, 1.7vw, 1.35rem);
                font-weight: 650;
                letter-spacing: -0.02em;
                box-shadow:
                    0 18px 38px rgba(0, 0, 0, 0.35),
                    inset 0 1px 0 rgba(255, 255, 255, 0.95);
            }

            .cta-badge {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 1.55rem;
                line-height: 1;
                font-family: "SF Pro Display", "Segoe UI Symbol", sans-serif;
            }

            .links {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 1.4rem;
                flex-wrap: wrap;
            }

            .links a {
                color: var(--link);
                text-decoration: none;
                font-size: 1rem;
                transition:
                    color 180ms ease,
                    transform 180ms ease;
            }

            .screenshots {
                width: min(100%, 74rem);
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: clamp(0.75rem, 2vw, 1.25rem);
                align-items: end;
                margin-top: 0.1rem;
            }

            .screenshot {
                width: 100%;
                height: auto;
                display: block;
                object-fit: contain;
            }

            .links a:hover,
            .links a:focus-visible {
                color: var(--link-hover);
                transform: translateY(-1px);
            }

            .links a:focus-visible {
                outline: 2px solid rgba(255, 255, 255, 0.3);
                outline-offset: 0.35rem;
                border-radius: 999px;
            }

            @media (max-width: 640px) {
                main {
                    gap: 0.6rem;
                    padding: 0.8rem 0.75rem 0;
                }

                .hero {
                    padding: 1.2rem 1rem 1.15rem;
                    border-radius: 1.25rem;
                }

                .brand {
                    gap: 0.75rem;
                    margin-bottom: 1.5rem;
                    padding-right: 0.9rem;
                }

                .brand-mark {
                    width: 2.75rem;
                    height: 2.75rem;
                }

                .subtitle {
                    margin-bottom: 2rem;
                }

                .cta {
                    min-width: 100%;
                    width: min(100%, 22rem);
                    padding-inline: 1.5rem;
                }

                .links {
                    gap: 1rem;
                }

                .screenshots {
                    grid-template-columns: 1fr;
                    gap: 0.2rem;
                    width: min(100%, 34rem);
                }
            }
        </style>
    </head>
    <body>
        <main>
            <section class="hero" aria-label="ShelfLife landing page">
                <div class="brand">
                    <img
                        class="brand-mark"
                        src="./ShelfLife-iOS-Dark-1024x1024@1x.png"
                        alt="ShelfLife app icon"
                    />
                    <div class="brand-copy">
                        <span class="brand-kicker">Food Tracking</span>
                        <span class="brand-name">ShelfLife</span>
                    </div>
                </div>

                <h1>Track Expiry Dates. Waste Less Food.</h1>
                <p class="subtitle">
                    Scan groceries, stay ahead of what needs to be used next,
                    and keep your kitchen organized with ShelfLife.
                </p>

                <div class="cta-shell">
                    <div class="cta">
                        <span class="cta-badge" aria-hidden="true"></span>
                        <span>Download</span>
                    </div>

                    <nav class="links" aria-label="Legal links">
                        <a href="./terms">Terms of Service</a>
                        <a href="mailto:support@tryshelflife.com">Support</a>
                        <a href="./privacy">Privacy Policy</a>
                    </nav>
                </div>
            </section>

            <section class="screenshots" aria-label="ShelfLife app screenshots">
                <img
                    class="screenshot"
                    src="./screenshots/screen2.webp"
                    width="1080"
                    height="1500"
                    alt="ShelfLife app screenshot showing tracked grocery items"
                />
                <img
                    class="screenshot"
                    src="./screenshots/screen3.webp"
                    width="1080"
                    height="1500"
                    alt="ShelfLife app screenshot showing expiry tracking details"
                />
            </section>
        </main>
    </body>
</html>
